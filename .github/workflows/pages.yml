name: Cam Balkon PVC - GitHub Pages Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cam-balkon-pvc-demo-pages
  cancel-in-progress: true

jobs:
  build:
    name: Derlenmis ziyaretci demosunu denetle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Demo yayin dosyalarini al
        uses: actions/checkout@v4
      - name: Node.js 24 kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Statik demo guvenlik ve baglanti kontrolleri
        run: node scripts/check-static-release.mjs
      - name: GitHub Pages'i yapilandir
        uses: actions/configure-pages@v5
      - name: Yalnizca derlenmis site klasorunu yayina hazirla
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Demo yayini
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages yayini
        id: deployment
        uses: actions/deploy-pages@v5
